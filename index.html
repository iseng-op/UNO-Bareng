h1,h2,.title{font-family:'Space Grotesk',system-ui,sans-serif;}
.screen{min-height:100%; display:flex; flex-direction:column; align-items:center; padding:24px 16px 40px;}
.title{font-size:28px; font-weight:700; margin:8px 0 4px;}
.sub{color:var(--sub); font-size:14px; margin-bottom:24px; text-align:center;}
.card-box{background:rgba(35,36,47,.86); backdrop-filter:blur(6px); border-radius:16px; padding:20px; width:100%; max-width:380px; border:1px solid rgba(255,255,255,.06);}
input{-webkit-appearance:none; appearance:none; width:100%; padding:12px 14px; border-radius:10px; border:1px solid #3a3c4d; background-color:var(--panel2) !important; color:var(--text) !important; caret-color:var(--text); font-size:16px; margin-bottom:12px;}
input::placeholder{color:var(--sub); opacity:1;}
input:focus{outline:2px solid var(--accent);}
button{cursor:pointer; border:none; border-radius:10px; font-weight:700; font-family:'Space Grotesk',sans-serif; font-size:15px; padding:13px 16px;}
button:active{transform:scale(.97);}
.btn-primary{background:var(--accent); color:#0b1f1d; width:100%;}
.btn-secondary{background:var(--panel2); color:var(--text); width:100%; margin-top:10px;}
.btn-primary:disabled{opacity:.4; cursor:not-allowed;}
.divider{display:flex; align-items:center; gap:10px; color:var(--sub); font-size:13px; margin:18px 0;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:#3a3c4d;}
.room-code{font-size:42px; font-weight:700; letter-spacing:6px; text-align:center; margin:10px 0; color:var(--accent);}
.players{list-style:none; padding:0; margin:16px 0; width:100%;}
.players li{background:var(--panel2); padding:12px 14px; border-radius:10px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
.tag{font-size:11px; color:var(--bg); background:var(--accent); padding:2px 8px; border-radius:20px; font-weight:700;}
.game{width:100%; max-width:520px; display:flex; flex-direction:column; align-items:center; gap:14px;}
.opponents{display:flex; flex-wrap:wrap; gap:14px; justify-content:center; align-items:flex-end; width:100%; position:relative; z-index:2;}
.opp{background:rgba(35,36,47,.82); backdrop-filter:blur(4px); border-radius:12px; padding:8px 12px; font-size:13px; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:64px; border:2px solid transparent;}
.opp.active{border-color:var(--accent);}
.table{display:flex; align-items:center; gap:24px; margin:10px 0;}
.uno-card{width:64px; height:96px; border-radius:10px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(0,0,0,.45); flex-shrink:0; border:3px solid rgba(255,255,255,.25);}
.uno-card.r{background:var(--r)} .uno-card.y{background:var(--y)} .uno-card.g{background:var(--g)} .uno-card.b{background:var(--b)}
.uno-card.k{background:var(--wild); background-image:conic-gradient(var(--r) 0 90deg,var(--y) 90deg 180deg,var(--g) 180deg 270deg,var(--b) 270deg 360deg);}
.uno-card.r::before,.uno-card.y::before,.uno-card.g::before,.uno-card.b::before,.uno-card.k::before{

 if(r.pendingColor){let count=0,got=false;while(r.deck.length||r.discard.length>1){const c=drawOne(r,pid);if(!c)break;hand.push(c);count++;const f=r.mode==='flip'?c[r.side]:c;if(f.color===r.pendingColor){got=true;break;}}r.log=cur.name+' mengambil '+count+' kartu sampai warna '+(r.mode==='flip'?FLIP_DARK_NAMES[r.pendingColor]||FLIP_LIGHT[r.pendingColor]:CLASSIC_NAMES[r.pendingColor])+' muncul.';r.pendingColor=null;r.turn=(r.turn+r.dir+r.players.length)%r.players.length;return r;}
 if(r.pendingDraw>0)n=r.pendingDraw;for(let i=0;i<n;i++){const c=drawOne(r,pid);if(c)hand.push(c);}r.log=r.pendingDraw>0?cur.name+' mengambil '+n+' kartu penalti.':cur.name+' mengambil 1 kartu.';r.pendingDraw=0;r.pendingKind=null;r.turn=(r.turn+r.dir+r.players.length)%r.players.length;return r;}
function flipAll(r){r.side=r.side==='light'?'dark':'light';r.activeColor=null;r.pendingDraw=0;r.pendingKind=null;r.pendingColor=null;}
function finishRound(r,pid){r.status='over';r.winner=pid;const winner=r.players.find(p=>p.id===pid);r.players.forEach(p=>{const st=r.stats[p.id]||{wins:0,losses:0,matches:0,points:0};st.matches++;if(p.id===pid)st.wins++;else st.losses++;r.stats[p.id]=st;});r.history=[...(r.history||[]),{match:r.matchNumber,winner:pid,winnerName:winner?.name||'?',mode:r.mode,side:r.side}].slice(-20);r.log=(winner?.name||'Pemain')+' menang Match #'+r.matchNumber+'!';return r;}
function playCardState(r,pid,idx,chosenColor){r=clone(r);const cur=r.players[r.turn];if(!cur||cur.id!==pid)return r;const hand=r.hands[pid]||[];const raw=hand[idx];if(!raw)return r;const c=r.mode==='flip'?raw[r.side]:raw;const cf=faceData(c);if(!cf||!playable(r,raw))return r;hand.splice(idx,1);r.discard.push(raw);const t=cf.type;r.log=cur.name+' memainkan '+cardName(c)+'.';
 if(hand.length===1)r.unoCalled[pid]=false;if(hand.length===0)return finishRound(r,pid);
 let next=(r.turn+r.dir+r.players.length)%r.players.length;
 if(cf.color==='k'){r.activeColor=chosenColor||((r.mode==='flip'&&r.side==='dark')?'p':'r');}else r.activeColor=cf.color;
 if(t==='flip'&&r.mode==='flip'){flipAll(r);r.log=cur.name+' memainkan FLIP — '+(r.side==='dark'?'DARK':'LIGHT')+' SIDE!';playSound('flip');next=(r.turn+r.dir+r.players.length)%r.players.length;}
 else if(t==='skip'||t==='skipall'){next=t==='skipall'?r.turn:(next+r.dir+r.players.length)%r.players.length;}
 else if(t==='rev'){r.dir*=-1;next=r.players.length===2?r.turn:(r.turn+r.dir+r.players.length)%r.players.length;}
 else if(t==='d1'||t==='d2'||t==='wild2'||t==='d5'||t==='wild4'||t==='d6'||t==='d10'){
const amt=t==='d10'?10:(t==='d6'?6:(t==='d5'?5:(t==='wild4'?4:(t==='d1'?1:2))));r.pendingDraw=(r.pendingDraw||0)+amt;r.pendingKind=t;r.log+=' +'+amt+(r.pendingDraw!==amt?' (tumpukan jadi +'+r.pendingDraw+')':'')+' untuk '+r.players[next].name+'.';/* Penalti selalu menjadi giliran pemain berikutnya. Pada mode No Mercy, pemain berikutnya boleh menumpuk kartu penalti (dijumlahkan, bukan ditimpa); pada mode lain dia wajib mengambil penalti. Jangan lompat giliran kedua kali, terutama pada match 2 pemain. */}
 else if(t==='wildColor'){r.pendingColor=chosenColor||'p';r.log+=' '+r.players[next].name+' harus mengambil sampai warna yang dipilih muncul.';}
 if(r.mode==='dare'&&(t==='d2'||t==='wild4'))r.log+=' Dare: '+['Nyanyi 5 detik!','Tirukan suara ayam!','Joget 3 detik!','Sebut 3 buah secepat mungkin!'][Math.floor(Math.random()*4)];
 r.turn=next;return r;}
function callUnoState(r,pid){r=clone(r);const hand=r.hands[pid]||[];if(hand.length!==1)return r;r.unoCalled[pid]=true;const p=r.players.find(x=>x.id===pid);r.log=(p?.name||'Pemain')+' bilang UNO!';return r;}
function catchUnoState(r,catcherId,targetId){r=clone(r);if(!targetId||catcherId===targetId)return r;const targetHand=r.hands[targetId];if(!targetHand||targetHand.length!==1)return r;if(r.unoCalled[targetId])return r;const amt=2;for(let i=0;i<amt;i++){const c=drawOne(r,targetId);if(c)targetHand.push(c);}r.unoCalled[targetId]=true;const catcher=r.players.find(x=>x.id===catcherId),target=r.players.find(x=>x.id===targetId);r.log=(catcher?.name||'Pemain')+' menangkap '+(target?.name||'Pemain')+' lupa bilang UNO! +'+amt+' kartu penalti.';return r;}
function restartState(r){r=clone(r);r.status='lobby';r.hands={};r.deck=[];r.discard=[];r.winner=null;r.pendingDraw=0;r.pendingKind=null;r.pendingColor=null;r.unoCalled={};r.log='Match selesai. Lobby dibuka lagi.';return r;}

/* ===== Mode Vs Bot (offline, tanpa MQTT) ===== */
function createAIRoom(name,botCount){
 myName=name;localStorage.setItem('uno_name',name);
 roomCode=genCode();isHost=true;offlineMode=true;connected=false;mqttClient=null;
 let s=newRoomState(roomCode,clientId,name);
 s.offlineAI=true;
 const shuffledNames=shuffle(BOT_NAMES);
 for(let i=0;i<botCount;i++){
  const id='bot_'+i+'_'+Math.random().toString(36).slice(2,6);
  s.players.push({id,name:(shuffledNames[i%shuffledNames.length])+' 🤖',isBot:true});
  s.stats[id]={wins:0,losses:0,matches:0,points:0};
 }
 s.log='Room latihan vs Bot dibuat.';
 publishState(s);
}
function botPickColor(hand,excludeIdx,r){
 const count={};
 hand.forEach((raw,i)=>{if(i===excludeIdx)return;const c=r.mode==='flip'?raw[r.side]:raw;const f=faceData(c);if(f&&f.color&&f.color!=='k')count[f.color]=(count[f.color]||0)+1;});
 let best=null,bestN=-1;for(const k in count){if(count[k]>bestN){best=k;bestN=count[k];}}
 if(best)return best;
 const palette=(r.mode==='flip'&&r.side==='dark')?['p','t','o','v']:['r','y','g','b'];
 return palette[Math.floor(Math.random()*palette.length)];
}
function playBotTurn(botId){
 if(!isHost||!offlineMode||!state||state.status!=='playing')return;
 const cur=state.players[state.turn];
 if(!cur||cur.id!==botId||!cur.isBot)return;
 const hand=state.hands[botId]||[];
 const candidates=[];
 for(let i=0;i<hand.length;i++){if(playable(state,hand[i]))candidates.push(i);}
 if(candidates.length===0){publishState(drawCardState(state,botId));return;}
 const nonWild=candidates.filter(i=>!isWild(currentFace(hand[i])));
 const pool=nonWild.length?nonWild:candidates;
 const pick=pool[Math.floor(Math.random()*pool.length)];
 const c=currentFace(hand[pick]);
 const chosenColor=isWild(c)?botPickColor(hand,pick,state):null;
 let ns=playCardState(state,botId,pick,chosenColor);
 if((ns.hands[botId]||[]).length===1&&Math.random()<0.9)ns=callUnoState(ns,botId);
 publishState(ns);
}
function scheduleAIIfNeeded(){
 if(!isHost||!offlineMode||!state||state.status!=='playing'){if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}aiTimerFor=null;return;}
 const cur=state.players[state.turn];
 if(!cur||!cur.isBot){if(aiTimer){clearTimeout(aiTimer);aiTimer=null;}aiTimerFor=null;return;}
 const sig=state.matchNumber+':'+state.turn+':'+(state.hands[cur.id]||[]).length+':'+state.pendingDraw+':'+state.pendingColor+':'+state.side+':'+state.deck.length;
 if(aiTimerFor===sig)return;
 aiTimerFor=sig;if(aiTimer)clearTimeout(aiTimer);
 aiTimer=setTimeout(()=>{aiTimer=null;playBotTurn(cur.id);},650+Math.random()*550);
}
function maybeAICatch(){
 if(!isHost||!offlineMode||!state||state.status!=='playing')return;
 const target=state.players.find(p=>(state.hands[p.id]||[]).length===1&&!state.unoCalled?.[p.id]);
 if(!target){aiCatchFor=null;return;}
 const bots=state.players.filter(p=>p.isBot&&p.id!==target.id);
 if(!bots.length)return;
 if(aiCatchFor===target.id)return;
 aiCatchFor=target.id;
 aiCatchTimer=setTimeout(()=>{
  aiCatchTimer=null;
  if(!isHost||!offlineMode||!state||state.status!=='playing')return;
  if((state.hands[target.id]||[]).length!==1||state.unoCalled?.[target.id]){aiCatchFor=null;return;}
  if(Math.random()<0.5){const catcher=bots[Math.floor(Math.random()*bots.length)];publishState(catchUnoState(state,catcher.id,target.id));}
  aiCatchFor=null;
 },1200+Math.random()*1800);
}

function topics(code){return {state:NS+code+'/state',action:NS+code+'/action',chat:NS+code+'/chat'};}
function connectMqtt(){return new Promise((resolve,reject)=>{if(typeof mqtt==='undefined'){reject(new Error('Library MQTT gagal dimuat. Coba buka file di Chrome dan pastikan internet aktif.'));return;}if(mqttClient&&connected)return resolve(mqttClient);try{mqttClient=mqtt.connect(BROKER,{clientId:'unoc_'+clientId+'_'+Math.random().toString(16).slice(2),clean:true,protocolVersion:4,connectTimeout:15000,reconnectPeriod:1500,keepalive:45});}catch(e){reject(e);return;}let settled=false;const to=setTimeout(()=>{if(!settled){settled=true;reject(new Error('Koneksi ke server game timeout. Coba ganti jaringan/Wi-Fi.'));}},16000);mqttClient.once('connect',()=>{connected=true;if(!settled){settled=true;clearTimeout(to);resolve(mqttClient);}});mqttClient.on('reconnect',()=>{connected=false;});mqttClient.on('close',()=>{connected=false;});mqttClient.on('offline',()=>{connected=false;});mqttClient.on('error',e=>{if(!settled){settled=true;clearTimeout(to);reject(e||new Error('Koneksi MQTT gagal'));}});});}
function publishState(ns){state=clone(ns);state.updatedAt=Date.now();const t=topics(roomCode);if(mqttClient&&connected)mqttClient.publish(t.state,JSON.stringify(state),{retain:true,qos:1});render();}
function sendAction(a){if(!mqttClient||!connected){showBanner('Belum tersambung ke server game.');return;}mqttClient.publish(topics(roomCode).action,JSON.stringify(a),{qos:1});}
function sendChat(message){const t=topics(roomCode);if(!mqttClient||!connected)return;mqttClient.publish(t.chat,JSON.stringify({type:'chat',id:clientId,name:myName,message:String(message).slice(0,160),timestamp:Date.now()}),{qos:1});}
function handleAction(a){
 if(!isHost||!state||!a)return;
 if(a.type==='sync'||a.type==='join'){
  const before=state.players?.some(p=>p.id===a.id);
  const ns=a.type==='join'?addPlayer(state,a.id,String(a.name||'Pemain').slice(0,16)):state;
  if(a.type==='join' && !before && ns.players.some(p=>p.id===a.id)) state=ns;
  // Always answer join/sync requests with the authoritative host state.
  // This makes the joiner recover even if it missed an earlier retained publish.
  state.updatedAt=Date.now();
  mqttClient.publish(topics(roomCode).state,JSON.stringify(state),{retain:true,qos:1});
  render();
  return;
 }
 let ns=state;
 if(a.type==='draw')ns=drawCardState(state,a.id);
 else if(a.type==='play')ns=playCardState(state,a.id,a.idx,a.color);
 else if(a.type==='uno')ns=callUnoState(state,a.id);
 else if(a.type==='catch')ns=catchUnoState(state,a.id,a.targetId);
 if(JSON.stringify(ns)!==JSON.stringify(state))publishState(ns);
}
function installMqttHandler(topicState,topicAction,topicChat,onState){
 mqttClient.on('message',(topic,payload)=>{
  if(topic!==topicState&&topic!==topicAction&&topic!==topicChat)return;
  try{const raw=payload.toString();if(!raw)return;const d=JSON.parse(raw);
   if(topic===topicAction){onState?.('action',d);return;}
   if(topic===topicState){onState?.('state',d);return;}
   if(topic===topicChat){onState?.('chat',d);}
  }catch(e){console.warn('UNO MQTT message error',e);}
 });
}
function acceptRemoteState(d){
 // The host is the only authoritative state writer. Joiners must accept
 // the latest state they receive rather than comparing device timestamps,
 // because phone clocks can differ and an older local timestamp could block
 // a valid host update.
 if(!d||typeof d!=='object'||!Array.isArray(d.players))return false;
 state=clone(d);state.hands=state.hands||{};state.players=state.players||[];
 return true;
}
function startSyncLoop(){
 if(window._unoSyncLoop)clearInterval(window._unoSyncLoop);
 window._unoSyncLoop=setInterval(()=>{
  if(roomCode&&state&&connected&&!isHost)sendAction({type:'sync',id:clientId,ts:Date.now()});
 },2000);
}
async function createRoom(name){
 await connectMqtt();const code=genCode();roomCode=code;isHost=true;const t=topics(code);
 installMqttHandler(t.state,t.action,t.chat,(kind,d)=>{
  if(kind==='action')handleAction(d);
  else if(kind==='state'){/* Host is authoritative; ignore its own echoed state messages. */}
  else if(kind==='chat'){if(!state)return;state.chat=[...(state.chat||[]),d].slice(-80);if(d.id!==clientId)notifyChat(d);else playSound('chat');renderChatOnly();}
 });
 await new Promise((resolve,reject)=>mqttClient.subscribe([t.state,t.action,t.chat],{qos:1},(err)=>err?reject(err):resolve()));
 publishState(newRoomState(code,clientId,name));
}
async function joinRoom(code,name){
 await connectMqtt();roomCode=code;isHost=false;const t=topics(code);let got=false;
 installMqttHandler(t.state,null,t.chat,(kind,d)=>{
  if(kind==='state'){
   if(!acceptRemoteState(d))return;got=true;
   const me=state.players.some(p=>p.id===clientId);
   if(joinTimer&&me){clearInterval(joinTimer);joinTimer=null;}
   render();
  }else if(kind==='chat'){if(!state)return;state.chat=[...(state.chat||[]),d].slice(-80);if(d.id!==clientId)notifyChat(d);else playSound('chat');renderChatOnly();}
 });
 await new Promise((resolve,reject)=>mqttClient.subscribe([t.state,t.chat],{qos:1},(err)=>err?reject(err):resolve()));
 startSyncLoop();
 joinTries=0;
 const tryJoin=()=>{const me=state?.players?.some(p=>p.id===clientId);if(me){if(joinTimer){clearInterval(joinTimer);joinTimer=null;}return;}sendAction({type:'join',id:clientId,name:myName,ts:Date.now()});};
 joinTimer=setInterval(()=>{joinTries++;tryJoin();if(joinTries>=20){const meNow=state?.players?.some(p=>p.id===clientId);clearInterval(joinTimer);joinTimer=null;if(!meNow&&!got){showBanner('Room tidak ditemukan / host belum online. Pastikan kode benar dan host masih membuka room.');roomCode=null;state=null;render();}}},1000);
 tryJoin();
}
function genCode(){const s='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<4;i++)c+=s[Math.floor(Math.random()*s.length)];return c;}
function showBanner(msg){let b=document.getElementById('banner');if(!b){b=document.createElement('div');b.id='banner';b.className='banner';document.body.appendChild(b);}b.textContent=msg;clearTimeout(b._t);b._t=setTimeout(()=>b.remove(),4500);}
function setTheme(v){theme=v;localStorage.setItem('uno_theme',v);document.documentElement.dataset.theme=v;}
function openRules(){document.getElementById('rulesModal')?.classList.remove('hidden');}
function openStats(){document.getElementById('statsModal')?.classList.remove('hidden');}
function render(){if(!roomCode||!state){renderHome();return;}if(state.status==='lobby')renderLobby();else if(state.status==='playing')renderGame();else renderOver();}
function shellTop(title,sub=''){return `<div class="topbar"><div><div class="brand">UNO <span>BARENG</span></div><div class="mini-title">${esc(title)}</div></div><div class="top-actions"><button class="iconbtn" id="rulesBtn">📖</button><button class="iconbtn" id="themeBtn">${theme==='dark'?'☀️':'🌙'}</button></div></div>${sub?`<div class="sub">${esc(sub)}</div>`:''}`;}
function bindCommon(){document.getElementById('rulesBtn')?.addEventListener('click',openRules);document.getElementById('themeBtn')?.addEventListener('click',()=>setTheme(theme==='dark'?'light':'dark')||render());}
function renderHome(){app.innerHTML=`<div class="screen home">${shellTop('Main kartu bareng teman','Multiplayer realtime • 2–8 pemain')}<div class="hero"><div class="hero-card">🃏</div><h1>UNO Bareng</h1><p>Classic, No Mercy, Dare, dan sekarang <b>UNO FLIP</b>.</p></div><div class="card-box glass"><input id="nameInput" placeholder="Nama kamu" value="${esc(myName)}" maxlength="16"><button class="btn-primary" id="createBtn">Buat Room</button><div class="divider">atau</div><input id="codeInput" placeholder="Kode room 4 karakter" maxlength="4"><button class="btn-secondary" id="joinBtn">Gabung Room</button></div><div class="card-box glass" style="margin-top:14px"><h3 style="margin:0 0 10px;font-size:15px">🤖 Latihan vs Bot</h3><div class="range-row"><span>Jumlah bot</span><b id="botCountVal">${aiBotCount}</b></div><div class="range-buttons"><button class="ghost" id="botMinus">−</button><button class="ghost" id="botPlus">+</button></div><button class="btn-primary" id="startAIBtn">Mulai vs Bot</button></div><div class="home-actions"><button class="ghost" id="rulesHome">📖 Rules</button><button class="ghost" id="settingsHome">⚙️ Pengaturan</button></div></div>`;bindCommon();document.getElementById('rulesHome').onclick=openRules;document.getElementById('settingsHome').onclick=openSettings;document.getElementById('createBtn').onclick=async()=>{const name=document.getElementById('nameInput').value.trim()||'Pemain';myName=name;localStorage.setItem('uno_name',name);const b=document.getElementById('createBtn');b.disabled=true;b.textContent='Menghubungkan...';try{await createRoom(name);}catch(e){showBanner('Gagal terhubung: '+e.message);b.disabled=false;b.textContent='Buat Room';}};document.getElementById('joinBtn').onclick=async()=>{const name=document.getElementById('nameInput').value.trim()||'Pemain';const code=document.getElementById('codeInput').value.trim().toUpperCase();if(code.length!==4)return showBanner('Kode room harus 4 karakter.');myName=name;localStorage.setItem('uno_name',name);try{await joinRoom(code,name);}catch(e){showBanner('Gagal terhubung: '+e.message);}};document.getElementById('botMinus').onclick=()=>{aiBotCount=Math.max(1,aiBotCount-1);document.getElementById('botCountVal').textContent=aiBotCount;};document.getElementById('botPlus').onclick=()=>{aiBotCount=Math.min(7,aiBotCount+1);document.getElementById('botCountVal').textContent=aiBotCount;};document.getElementById('startAIBtn').onclick=()=>{const name=document.getElementById('nameInput').value.trim()||'Pemain';createAIRoom(name,aiBotCount);};}
function renderLobby(){const host=state.hostId===clientId;const ai=!!state.offlineAI;const modes=[['classic','Classic','UNO standar'],['nomercy','No Mercy','+2/+4/+6/+10 dapat ditumpuk'],['dare','Dare','Penalty + tantangan'],['flip','UNO FLIP','Light Side ↔ Dark Side']];app.innerHTML=`<div class="screen">${shellTop('Lobby',ai?'Mode latihan vs Bot (offline)':'Bagikan kode room ke teman')}<div class="room-hero">${ai?`<div style="font-size:40px">🤖</div><div class="sub" style="margin:6px 0 0">VS BOT • OFFLINE</div>`:`<div class="room-code">${state.code}</div><button class="copy-btn" id="copyCode">Salin kode</button>`}</div><div class="lobby-grid"><div class="card-box glass"><h3>Pemain (${state.players.length}/8)</h3><div class="player-list">${state.players.map((p,i)=>`<div class="player-row"><div class="avatar">${esc(p.name[0]||'?').toUpperCase()}</div><div><b>${esc(p.name)}</b><small>${p.id===state.hostId?'HOST':(p.isBot?'BOT':'Pemain')}</small></div><span>${state.stats?.[p.id]?.wins||0}W / ${state.stats?.[p.id]?.losses||0}L</span></div>`).join('')}</div></div><div class="card-box glass">${host?`<h3>Mode</h3><div class="mode-grid">${modes.map(m=>`<button class="mode ${state.mode===m[0]?'selected':''}" data-mode="${m[0]}"><strong>${m[1]}</strong><small>${m[2]}</small></button>`).join('')}</div><div class="range-row"><span>Kartu awal</span><b>${state.startCards}</b></div><div class="range-buttons"><button class="ghost" id="minus">−</button><button class="ghost" id="plus">+</button></div><button class="btn-primary" id="startBtn" ${state.players.length<2?'disabled':''}>Mulai Game</button>`:`<div class="waiting">⏳ Menunggu host memulai...<br><b>${modes.find(x=>x[0]===state.mode)?.[1]}</b></div>`}</div></div><div class="lobby-footer"><button class="ghost" id="statsBtn">📊 Statistik</button><button class="ghost" id="rulesLobby">📖 Rules</button></div></div>`;bindCommon();document.getElementById('copyCode')?.addEventListener('click',()=>{navigator.clipboard?.writeText(state.code);showBanner('Kode disalin.');});document.getElementById('rulesLobby').onclick=openRules;document.getElementById('statsBtn').onclick=openStats;if(host){document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{const s=clone(state);s.mode=b.dataset.mode;publishState(s);});document.getElementById('minus').onclick=()=>{const s=clone(state);s.startCards=Math.max(5,s.startCards-1);publishState(s);};document.getElementById('plus').onclick=()=>{const s=clone(state);s.startCards=Math.min(10,s.startCards+1);publishState(s);};document.getElementById('startBtn').onclick=()=>publishState(startGameState(state));}}
function getMyHand(){if(!state||!state.hands)return [];let h=state.hands[clientId];if(Array.isArray(h))return h;const me=state.players?.find(p=>p.id===clientId);if(me&&Array.isArray(state.hands[me.id]))return state.hands[me.id];return [];}
function renderGame(){
 const myHand=getMyHand();
 const topRaw=topFace(state);
 const top=faceData(topRaw);
 const cur=state.players[state.turn];
 const myTurn=cur?.id===clientId;
 const others=state.players.filter(p=>p.id!==clientId);
 const mePlayer=state.players.find(p=>p.id===clientId);
 const pending=state.pendingDraw>0;
 app.innerHTML=`<div class=\"screen game-screen\">${shellTop(state.mode==='flip'?`UNO FLIP • ${state.side==='dark'?'DARK':'LIGHT'}`:state.mode,'Match #'+state.matchNumber)}<div class=\"game-layout\"><main class=\"table-area\"><div class=\"opponents\">${others.map((p,i)=>{const active=cur?.id===p.id;const cnt=(state.hands[p.id]||[]).length;const catchable=cnt===1&&!state.unoCalled?.[p.id];const fanCount=Math.min(cnt,5);return `<div class=\"seat seat-${i%6} ${active?'active':''}\"><div class=\"mini-fan\">${Array.from({length:fanCount}).map(()=>'<span></span>').join('')}</div><div class=\"avatar\">${esc(p.name[0]||'?').toUpperCase()}</div><b>${esc(p.name)}</b>${p.id===state.hostId?'<small>HOST • ': '<small>'}${cnt} kartu</small>${state.unoCalled?.[p.id]?' <em>UNO!</em>':''}${catchable?`<button class=\"ghost catch-btn\" data-target=\"${p.id}\" style=\"margin-top:5px;padding:4px 9px;font-size:11px;background:var(--r);color:#fff;border:none;border-radius:8px\">🫵 Tangkap!</button>`:''}</div>`}).join('')}</div><div class=\"turn-pill ${myTurn?'mine':''}\">${myTurn?'🔥 Giliran kamu!':'Giliran '+esc(cur?.name||'...')} ${state.mode==='flip'?`• <b>${state.side==='dark'?'🌑 DARK':'☀️ LIGHT'}</b>`:''}${pending?` • +${state.pendingDraw}`:''}${state.pendingColor?` • warna ${state.pendingColor}`:''}</div><div class=\"table-center\"><div class=\"deck-stack\" id=\"drawPile\"><span>UNO</span><small>${state.deck.length} kartu</small></div><div class=\"discard-wrap\"><div class=\"uno-card big ${top?.color||''} ${top?.type==='number'?'number-face':''} ${state.mode==='flip'&&state.side==='dark'?'dark-face':''}"><div class=\"corner\">${esc(cardLabel(topRaw))}</div><div class=\"symbol\">${esc(cardLabel(topRaw))}</div><div class=\"corner bottom\">${esc(cardLabel(topRaw))}</div></div></div></div><div class=\"logbar\">${esc(state.log||'')}</div><div class=\"my-seat\"><div class=\"you-label\">KAMU • ${myHand.length} KARTU ${myHand.length===1?'<b>UNO!</b>':''}</div><div class=\"hand\" id=\"handRow\">${myHand.map((raw,i)=>{const c=state.mode==='flip'?raw[state.side]:raw;const f=faceData(c);const n=myHand.length;const mid=(n-1)/2;const ang=n>1?((i-mid)*Math.min(6,36/(n-1))).toFixed(1):0;const lift=Math.round(Math.abs(i-mid)*3);return `<button class=\"uno-card hand-card ${f?.color||''} ${f?.type==='number'?'number-face':''} ${state.mode==='flip'&&state.side==='dark'?'dark-face':''}\" data-i=\"${i}\" style=\"transform:rotate(${ang}deg) translateY(${lift}px);z-index:${i}${i>0?';margin-left:-20px':''}\" aria-label=\"${esc(cardName(c)+' '+(f?.value??''))}\"><span class=\"corner\">${esc(cardLabel(c))}</span><span class=\"symbol\">${esc(cardLabel(c))}</span><span class=\"corner bottom\">${esc(cardLabel(c))}</span></button>`}).join('')}</div><div class=\"hand-actions\"><button class=\"ghost\" id=\"unoBtn\">✋ UNO!</button><button class=\"ghost\" id=\"statsGame\">📊</button><span class=\"chat-toggle-wrap\"><button class=\"ghost\" id=\"chatToggle\">💬</button><span id=\"chatBadge\" class=\"chat-badge ${unreadChat?'':'hidden'}\">${unreadChat>99?'99+':unreadChat}</span></span></div></div></main><aside class=\"chat-panel\" id=\"chatPanel\"><div class=\"chat-head\"><b>💬 Chat All</b><button class=\"iconbtn\" id=\"chatClose\">×</button></div><div class=\"chat-list\" id=\"chatList\">${(state.chat||[]).map(chatHtml).join('')}</div><div class=\"chat-send\"><input id=\"chatInput\" maxlength=\"160\" placeholder=\"Tulis pesan...\"><button id=\"chatSend\">➤</button></div></aside></div><div class=\"modal hidden\" id=\"colorModal\"><div class=\"modal-box\"><h3>Pilih warna</h3><div class=\"color-grid\">${(state.mode==='flip'&&state.side==='dark'?['p','t','o','v']:['r','y','g','b']).map(c=>`<button class=\"color-choice ${c}\" data-c=\"${c}\">${state.mode==='flip'&&state.side==='dark'?FLIP_DARK_NAMES[c]:CLASSIC_NAMES[c]}</button>`).join('')}</div></div></div></div>`;
 bindCommon();
 document.getElementById('drawPile').onclick=()=>{if(!myTurn)return;playSound('draw');if(isHost)publishState(drawCardState(state,clientId));else sendAction({type:'draw',id:clientId});};
 document.querySelectorAll('.hand-card').forEach(el=>el.onclick=()=>{if(!myTurn)return;const i=+el.dataset.i;const raw=myHand[i];if(!playable(state,raw))return showBanner('Kartu itu belum bisa dimainkan.');const c=state.mode==='flip'?raw[state.side]:raw;if(isWild(c)){document.getElementById('colorModal').classList.remove('hidden');document.querySelectorAll('.color-choice').forEach(b=>b.onclick=()=>{document.getElementById('colorModal').classList.add('hidden');doPlay(i,b.dataset.c);});}else doPlay(i,null);});
 document.getElementById('unoBtn').onclick=()=>{playSound('uno');if(isHost)publishState(callUnoState(state,clientId));else sendAction({type:'uno',id:clientId});};
 document.querySelectorAll('.catch-btn').forEach(b=>{b.onclick=(e)=>{e.stopPropagation();const targetId=b.dataset.target;playSound('penalty');if(isHost)publishState(catchUnoState(state,clientId,targetId));else sendAction({type:'catch',id:clientId,targetId});};});
 document.getElementById('statsGame').onclick=openStats;
 document.getElementById('chatToggle').onclick=()=>{const panel=document.getElementById('chatPanel');panel.classList.toggle('open');if(panel.classList.contains('open')){unreadChat=0;updateChatBadge();}};
 document.getElementById('chatClose').onclick=()=>document.getElementById('chatPanel').classList.remove('open');
 document.getElementById('chatSend').onclick=sendChatFromInput;document.getElementById('chatInput').onkeydown=e=>{if(e.key==='Enter')sendChatFromInput();};
}
function updateChatBadge(){const b=document.getElementById('chatBadge');if(!b)return;b.textContent=unreadChat>99?'99+':String(unreadChat);b.classList.toggle('hidden',unreadChat<=0);}function notifyChat(m){playSound('chat');const panel=document.getElementById('chatPanel');if(panel?.classList.contains('open'))return;unreadChat++;updateChatBadge();const old=document.querySelector('.chat-toast');if(old)old.remove();const t=document.createElement('div');t.className='chat-toast';t.innerHTML='<b>💬 '+esc(m.name||'Pemain')+'</b><span>'+esc(m.message||'')+'</span><small>Pesan baru di Chat All</small>';document.body.appendChild(t);setTimeout(()=>t.remove(),3500);}function sendChatFromInput(){const i=document.getElementById('chatInput');const v=i?.value.trim();if(!v)return;sendChat(v);i.value='';}
function chatHtml(m){return `<div class="chat-msg ${m.id===clientId?'mine':''}"><b>${esc(m.name)}</b><span>${esc(m.message)}</span></div>`;}
function renderChatOnly(){const el=document.getElementById('chatList');if(el){el.innerHTML=(state.chat||[]).map(chatHtml).join('');el.scrollTop=el.scrollHeight;}}
function doPlay(idx,color){playSound('card');if(isHost)publishState(playCardState(state,clientId,idx,color));else sendAction({type:'play',id:clientId,idx,color});}
function renderOver(){const w=state.players.find(p=>p.id===state.winner);const me=state.winner===clientId;if(me)playSound('win');app.innerHTML=`<div class="screen over-screen">${shellTop('Match Selesai','Match #'+state.matchNumber)}<div class="winner-card"><div class="trophy">🏆</div><h1>${me?'Kamu Menang!':esc(w?.name||'Pemenang')}</h1><p>${me?'Selamat!':'Pemenang match ini adalah '+esc(w?.name||'Pemain')+'.'}</p><div class="public-stats">${state.players.map(p=>{const s=state.stats?.[p.id]||{};return `<div class="stat-row"><div><b>${esc(p.name)}</b><small>${s.matches||0} match</small></div><span>🏆 ${s.wins||0}W</span><span>💀 ${s.losses||0}L</span></div>`}).join('')}</div>${state.hostId===clientId?`<button class="btn-primary" id="againBtn">Main Lagi</button>`:'<div class="waiting">Menunggu host memulai match berikutnya...</div>'}<div class="over-actions"><button class="ghost" id="statsOver">📊 Statistik</button><button class="ghost" id="rulesOver">📖 Rules</button></div></div></div>`;bindCommon();document.getElementById('statsOver').onclick=openStats;document.getElementById('rulesOver').onclick=openRules;if(state.hostId===clientId)document.getElementById('againBtn').onclick=()=>publishState(restartState(state));}
function openSettings(){document.getElementById('settingsModal')?.classList.remove('hidden');}
function injectModals(){if(document.getElementById('rulesModal'))return;document.body.insertAdjacentHTML('beforeend',`<div class="modal hidden" id="rulesModal"><div class="modal-box wide"><button class="modal-x" onclick="this.closest('.modal').classList.add('hidden')">×</button><h2>📖 Rules Resmi</h2><h3>Aturan Umum</h3><ul><li>Kalau kartu di tanganmu tersisa 1, kamu wajib menekan tombol UNO! Kalau lupa dan pemain lain sadar duluan, mereka bisa menekan tombol 🫵 Tangkap! di kartumu — kamu langsung kena penalti +2 kartu.</li></ul><p>UNO FLIP menggunakan deck dua sisi: Light Side dan Dark Side. Saat kartu FLIP dimainkan, kartu di tangan, draw pile, dan discard pile berpindah ke sisi lain.</p><h3>UNO FLIP</h3><ul><li>112 kartu: Light Side dan Dark Side.</li><li>Light: Draw One (+1), Reverse, Skip, FLIP, Wild, Wild Draw Two (W+2). W+2 memang meminta pemain memilih warna pada aturan resmi UNO FLIP.</li><li>Dark: Draw Five, Reverse, Skip Everyone, FLIP, Wild, Wild Draw Color.</li><li>FLIP mengubah seluruh permainan ke sisi lawan.</li><li>Wild Draw Color membuat pemain berikutnya mengambil kartu sampai mendapatkan warna yang dipilih.</li><li>Menurut lembar instruksi Mattel, permainan resmi menggunakan sistem skor kumulatif dan pemain pertama yang mencapai 500 poin memenangkan permainan.</li></ul><p class="source-note">Referensi: Mattel UNO FLIP! GDR44 Instruction Sheet.</p><h3>Mode lain</h3><p><b>Classic</b>: aturan UNO standar. <b>No Mercy</b>: seperti UNO No Mercy resmi — deck ditambah 4 kartu Wild +6 dan 4 kartu Wild +10 (hitam, bebas pilih warna). Kartu +2/+4/+6/+10 boleh ditumpuk (stacking) ke pemain berikutnya, tapi kartu penumpuk harus bernilai <b>sama atau lebih besar</b> dari kartu penalti terakhir yang dimainkan (mis. +2 bisa ditumpuk +4/+6/+10, tapi +10 cuma bisa ditumpuk +10). Yang tidak punya kartu penumpuk wajib mengambil semua akumulasinya. <b>Dare</b> adalah mode custom aplikasi ini.</p></div></div><div class="modal hidden" id="statsModal"><div class="modal-box wide"><button class="modal-x" onclick="this.closest('.modal').classList.add('hidden')">×</button><h2>📊 Statistik Publik</h2><div id="statsDynamic"></div><h3>Match terakhir</h3><div id="historyDynamic"></div></div></div><div class="modal hidden" id="settingsModal"><div class="modal-box"><button class="modal-x" onclick="this.closest('.modal').classList.add('hidden')">×</button><h2>⚙️ Pengaturan</h2><label>Nama<input id="settingsName" maxlength="16" value="${esc(myName)}"></label><label>Sound <input id="soundToggle" type="checkbox" ${soundOn?'checked':''}></label><label>Volume <input id="volumeRange" type="range" min="0" max="1" step=".05" value="${soundVolume}"></label><button class="btn-primary" id="saveSettings">Simpan</button></div></div>`);document.getElementById('soundToggle').onchange=e=>{soundOn=e.target.checked;localStorage.setItem('uno_sound',soundOn?'1':'0');if(soundOn)playSound('card');};document.getElementById('volumeRange').oninput=e=>{soundVolume=+e.target.value;localStorage.setItem('uno_volume',String(soundVolume));};document.getElementById('saveSettings').onclick=()=>{myName=document.getElementById('settingsName').value.trim()||myName;localStorage.setItem('uno_name',myName);document.getElementById('settingsModal').classList.add('hidden');showBanner('Pengaturan disimpan.');};}
function updateDynamicModals(){const s=document.getElementById('statsDynamic'),h=document.getElementById('historyDynamic');if(!s||!state)return;s.innerHTML=`<div class="public-stats">${state.players.map(p=>{const st=state.stats?.[p.id]||{};return `<div class="stat-row"><div><b>${esc(p.name)}</b><small>${st.matches||0} match</small></div><span>🏆 ${st.wins||0} W</span><span>💀 ${st.losses||0} L</span></div>`}).join('')}</div>`;h.innerHTML=(state.history||[]).slice().reverse().map(x=>`<div class="history-row">Match #${x.match} — <b>${esc(x.winnerName)}</b> menang <small>${x.mode}${x.mode==='flip'?' • '+x.side:' '}</small></div>`).join('')||'<span class="sub">Belum ada match.</span>';}
let lastLog='';const baseRender=render;render=function(){const old=lastLog;baseRender();injectModals();updateDynamicModals();if(state?.log&&state.log!==old){const l=state.log;if(l.includes('FLIP'))playSound('flip');else if(l.includes('menangkap'))playSound('penalty');else if(l.includes('mengambil'))playSound('draw');else if(l.includes('menang'))playSound('win');else if(l.includes('Draw')||l.includes('+'))playSound('card');else if(l.includes('memainkan'))playSound('card');lastLog=state.log;}if(offlineMode){scheduleAIIfNeeded();maybeAICatch();}};
setTheme(theme);render();
</script>
